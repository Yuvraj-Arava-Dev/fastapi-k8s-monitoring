apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000 # FastAPI
      - containerPort: 30090
        hostPort: 9090 # Prometheus
      - containerPort: 30000
        hostPort: 3000 # Grafana
  - role: worker