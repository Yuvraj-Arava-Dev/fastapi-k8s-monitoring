apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring-demo
data:
  fastapi-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Requests Per Second (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(http_requests_total[1m])) by (handler)",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "title": "HTTP Status Code Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(http_requests_total[1m])) by (status)",
              "legendFormat": "Status {{status}}"
            }
          ]
        },
        {
          "title": "95th Percentile Latency (Seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["fastapi", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "FastAPI Monitoring Dashboard"
    }
