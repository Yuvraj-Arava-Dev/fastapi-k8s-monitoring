apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'fastapi'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['fastapi-service.monitoring-demo.svc.cluster.local:8000']
