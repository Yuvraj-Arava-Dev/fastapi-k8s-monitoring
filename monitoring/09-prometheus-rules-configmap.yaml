apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring-demo
data:
  fastapi-alerts.yml: |
    groups:
      - name: fastapi_alerts
        rules:
          - alert: HighErrorRate5xx
            expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) * 100 > 5
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate detected on FastAPI"
              description: "5xx errors account for more than 5% of total requests over the last 1 minute."

          - alert: HighRequestLatency
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "FastAPI 95th percentile latency high"
              description: "95% of HTTP requests are taking longer than 500ms to respond."
